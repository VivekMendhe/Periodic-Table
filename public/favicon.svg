<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="flaskGrad" x1="12" y1="10" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="16" y1="36" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Atomic Orbital Rings in Background -->
  <ellipse cx="32" cy="32" rx="28" ry="11" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.6" transform="rotate(-30 32 32)" />
  <ellipse cx="32" cy="32" rx="28" ry="11" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.6" transform="rotate(30 32 32)" />

  <!-- Flask Body -->
  <path
    d="M27 8 H37 V20 L51.2 46.5 C53 50 50.5 54 46.5 54 H17.5 C13.5 54 11 50 12.8 46.5 L27 20 V8 Z"
    fill="#0f172a"
    stroke="url(#flaskGrad)"
    stroke-width="3.2"
    stroke-linejoin="round"
  />

  <!-- Flask Lip -->
  <rect x="25" y="6" width="14" height="4" rx="2" fill="url(#flaskGrad)" />

  <!-- Liquid inside flask -->
  <path
    d="M17.5 45 L22.5 35.5 C26 37 30 37 34 35.5 C38 34 41.5 35 46.5 45 C48.5 49 46 52 42.5 52 H21.5 C18 52 15.5 49 17.5 45 Z"
    fill="url(#liquidGrad)"
  />

  <!-- Effervescent Chemical Bubbles -->
  <circle cx="27" cy="44" r="2.5" fill="#ffffff" opacity="0.85" filter="url(#glow)" />
  <circle cx="37" cy="42" r="3" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
  <circle cx="32" cy="47" r="1.8" fill="#ffffff" opacity="0.75" />
  <circle cx="31" cy="31" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="34" cy="24" r="1.5" fill="#a855f7" opacity="0.8" />

  <!-- Central Atom Core Sparkle -->
  <circle cx="56" cy="18" r="2.2" fill="#38bdf8" />
  <circle cx="8" cy="46" r="2.2" fill="#a855f7" />
</svg>